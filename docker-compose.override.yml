# Local overrides: slower budgets for running the LLM on local Ollama (GTX 1650).
# Ollama processes one request at a time, so windows are analysed sequentially.
x-local-llm-env: &local-llm-env
  # 1 for Ollama (one request at a time); 3 with LLM=claude-code:* .
  ANALYSIS_WINDOW_CONCURRENCY: "${ANALYSIS_WINDOW_CONCURRENCY:-1}"
  # LLM=claude-code:sonnet runs the analyses through Claude Code with the
  # Claude subscription: token from `claude setup-token`.
  CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
  TRANSCRIPT_ANALYSIS_TIMEOUT_SECONDS: "1800"
  # 12 h: a full-day stream has ~140 windows analysed one at a time.
  ANALYSIS_TOTAL_TIMEOUT_SECONDS: "43200"
  # Day-long raw streams: one video job may run up to 48 h.
  VIDEO_JOB_TIMEOUT_SECONDS: "172800"
  PROCESSING_TASK_TIMEOUT_SECONDS: "180000"
  RERANK_TIMEOUT_SECONDS: "1800"
  # "Webcam + jogo" layout. Empty = detect the webcam automatically per clip.
  # Fixed box as fractions of the frame: x,y,w,h (e.g. 0.78,0.09,0.21,0.22).
  FACECAM_REGION: "${FACECAM_REGION:-}"
  FACECAM_FACE_SCALE: "${FACECAM_FACE_SCALE:-3.8}"
  # Dynamic camera (split / reaction / game shots) and SFX on the cuts.
  FACECAM_DYNAMIC: "${FACECAM_DYNAMIC:-true}"
  FACECAM_SFX: "${FACECAM_SFX:-true}"
  FACECAM_SFX_VOLUME: "${FACECAM_SFX_VOLUME:-0.5}"
  FACECAM_REACT_RISE_DB: "${FACECAM_REACT_RISE_DB:-8}"
  FACECAM_GAME_MIN_MOTION: "${FACECAM_GAME_MIN_MOTION:-8}"
  # Captions + hook title translated into this language when the speech differs.
  OUTPUT_LANGUAGE: "${OUTPUT_LANGUAGE:-}"

services:
  worker:
    environment: *local-llm-env
    # Whisper on the GTX 1650: CUDA torch in this image only (backend stays CPU).
    build:
      args:
        BACKEND_CPU_ONLY: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
  ai-worker:
    environment: *local-llm-env
  backend:
    environment: *local-llm-env
  frontend:
    environment:
      POSTADOR_URL: "${POSTADOR_URL:-http://host.docker.internal:5680}"
      TIKTOK_HASHTAGS: "${TIKTOK_HASHTAGS:-}"
      # Local only: sign in automatically as the local user (no login screen).
      LOCAL_AUTO_LOGIN: "true"
      NEXT_PUBLIC_LOCAL_AUTO_LOGIN: "true"
